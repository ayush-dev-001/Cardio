# Prediction targets. These columns must NEVER be used as model inputs
# (enforced by cardioscope_ml.config.assert_no_leakage and ml/tests).
#
# min_recall: decision threshold = highest threshold whose out-of-fold recall >= this value
#             (favours catching disease over avoiding false alarms; see docs).
# vessel_id links each vessel target to shared/vessels.json (used by backend + 3D view).

dataset:
  raw_path: "data/raw/extention of Z-Alizadeh sani   dataset.xlsx"
  sheet: "Sheet 1 - Table 1"    # the workbook's second sheet ("Sheet1") is empty
  processed_path: data/processed/cardioscope_clean.csv
  expected_rows: 303

targets:
  - id: cad
    column: Cath
    label: Coronary artery disease (overall)
    kind: overall
    min_recall: 0.90
    positive: CAD
    negative: Normal

  - id: lad
    column: LAD
    label: LAD stenosis
    kind: vessel
    min_recall: 0.80
    vessel_id: LAD
    positive: Stenotic
    negative: Normal

  - id: lcx
    column: LCX
    label: LCX stenosis
    kind: vessel
    min_recall: 0.80
    vessel_id: LCX
    positive: Stenotic
    negative: Normal

  - id: rca
    column: RCA
    label: RCA stenosis
    kind: vessel
    min_recall: 0.80
    vessel_id: RCA
    positive: Stenotic
    negative: Normal
