[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioscope-ml"
version = "0.1.0"
description = "CardioScope ML pipeline (CAD + LAD/LCX/RCA stenosis prediction)"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["cardioscope_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
