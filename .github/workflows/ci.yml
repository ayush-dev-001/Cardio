name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ML pipeline + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ml
      - name: Lint (ruff format check)
        run: ruff format --check ml backend
      - name: ML tests (data, config, leakage, pipeline, saved models)
        run: cd ml && python -m pytest -q
      - name: API tests
        run: cd backend && python -m pytest -q
      - name: Training smoke test (tiny nested CV, separate output folder)
        run: cd ml && python -m cardioscope_ml.train --fast --n-jobs 2

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
